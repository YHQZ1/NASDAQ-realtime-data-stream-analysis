apiVersion: 1

datasources:
  - name: Market Postgres
    uid: postgres-market
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: market
    isDefault: true
    editable: false
    jsonData:
      database: market
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: market
