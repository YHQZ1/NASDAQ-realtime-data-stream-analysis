[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq-stream"
version = "0.1.0"
description = "Real-time NASDAQ equity analytics with Kafka, Spark Structured Streaming, MLlib, PostgreSQL and Grafana"
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.0.4",
    "confluent-kafka>=2.5",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ERA"]

[tool.ruff.format]
quote-style = "double"
